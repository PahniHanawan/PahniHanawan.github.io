<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 &mdash; Halaman Tidak Ditemukan | Pahni Hanawan</title>
  <meta name="description" content="Halaman tidak ditemukan di portofolio Pahni Hanawan.">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23B3261E'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='bold' font-size='48' fill='%23ffffff'>PH</text></svg>">

  <!-- Google Fonts: Bricolage Grotesque & IBM Plex Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            paper: 'var(--color-bg)',
            surface: 'var(--color-surface)',
            'surface-alt': 'var(--color-surface-alt)',
            line: 'var(--color-border)',
            'line-strong': 'var(--color-border-strong)',
            ink: 'var(--color-text)',
            'ink-muted': 'var(--color-text-muted)',
            brand: 'var(--color-accent)',
            'brand-hover': 'var(--color-accent-hover)',
            'brand-soft': 'var(--color-accent-soft)',
            'on-brand': 'var(--color-on-accent)',
          },
          fontFamily: {
            heading: ['"Bricolage Grotesque"', 'sans-serif'],
            sans: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --color-bg: #FAF7F2;
      --color-surface: #FFFFFF;
      --color-surface-alt: #F1ECE4;
      --color-border: #E3DCD0;
      --color-border-strong: #8A8176;
      --color-text: #1B1815;
      --color-text-muted: #5C554C;
      --color-accent: #B3261E;
      --color-accent-hover: #8F1D17;
      --color-accent-soft: #F8E3E0;
      --color-on-accent: #FFFFFF;
      color-scheme: light;
    }
    html.dark {
      --color-bg: #14110F;
      --color-surface: #1D1916;
      --color-surface-alt: #26211D;
      --color-border: #3A332D;
      --color-border-strong: #8C8379;
      --color-text: #F3EDE4;
      --color-text-muted: #B5ABA0;
      --color-accent: #FF7A6B;
      --color-accent-hover: #FFA094;
      --color-accent-soft: #3A1C18;
      --color-on-accent: #14110F;
      color-scheme: dark;
    }
    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'IBM Plex Sans', system-ui, sans-serif;
    }
  </style>

  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between bg-paper text-ink">
  <header class="w-full border-b border-line py-4">

        <span class="w-8 h-8 rounded-lg bg-brand text-on-brand flex items-center justify-center text-sm font-bold">PH</span>
        <span>Pahni Hanawan</span>
      </a>
      <a href="index.html" class="text-xs font-mono text-ink-muted hover:text-brand">Beranda &rarr;</a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="font-mono text-7xl font-extrabold text-brand mb-4">404</div>
    <h1 class="font-heading font-bold text-2xl sm:text-3xl text-ink mb-3">Halaman Tidak Ditemukan</h1>
    <p class="text-sm text-ink-muted leading-relaxed mb-8">
      Halaman yang Anda tuju mungkin sudah dipindahkan, dihapus, atau tautan yang dimasukkan keliru.
    </p>
    <a href="index.html" class="inline-flex items-center px-6 py-3 rounded-xl bg-brand hover:bg-brand-hover text-on-brand font-semibold text-sm transition-all shadow-sm">
      &larr; Kembali ke Beranda
    </a>
  </main>

  <footer class="border-t border-line py-6 text-center text-xs font-mono text-ink-muted">
    &copy; 2026 Pahni Hanawan &middot; Portofolio Web Developer
  </footer>
</body>
</html>
